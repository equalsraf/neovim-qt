jobs:
  - job: Linux_GCC
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - script: |
        sudo add-apt-repository -y ppa:neovim-ppa/stable
        sudo apt update -y
        sudo apt install -y libqt6svg6 qt6-svg-dev libqt6svgwidgets6 neovim ninja-build qt6-base-dev qtchooser qmake6 qt6-base-dev-tools
      displayName: Install Dependencies
    - task: CMake@1
      inputs:
        workingDirectory: $(Build.BinariesDirectory)
        cmakeArgs: -GNinja -DCMAKE_BUILD_TYPE=Debug $(Build.SourcesDirectory)
      displayName: CMake Configure
    - task: CMake@1
      inputs:
        workingDirectory: $(Build.BinariesDirectory)
        cmakeArgs: --build .
      displayName: CMake Build


  - job: UbuntuNoble
    pool:
      vmImage: 'ubuntu-24.04'
    steps:
    - script: |
        sudo add-apt-repository -y ppa:neovim-ppa/stable
        sudo apt update -y
        sudo apt install -y libqt6svg6 qt6-svg-dev libqt6svgwidgets6 neovim ninja-build qt6-base-dev qtchooser qmake6 qt6-base-dev-tools
      displayName: Install Dependencies
    - task: CMake@1
      inputs:
        workingDirectory: $(Build.BinariesDirectory)
        cmakeArgs: -GNinja -DCMAKE_BUILD_TYPE=Debug $(Build.SourcesDirectory)
      displayName: CMake Configure
    - task: CMake@1
      inputs:
        workingDirectory: $(Build.BinariesDirectory)
        cmakeArgs: --build .
      displayName: CMake Build


  - job: Apple_qt6
    pool:
      vmImage: 'macOS-latest'
    steps:
    - script: brew install msgpack neovim ninja qt6
      displayName: Install Dependencies
    - task: CMake@1
      inputs:
        workingDirectory: $(Build.BinariesDirectory)
        cmakeArgs: -GNinja -DUSE_SYSTEM_MSGPACK=OFF -DCMAKE_BUILD_TYPE=Debug -DWITH_QT=Qt6 $(Build.SourcesDirectory)
      displayName: CMake Configure
    - task: CMake@1
      inputs:
        workingDirectory: $(Build.BinariesDirectory)
        cmakeArgs: --build .
      displayName: CMake Build


  - job: Windows_qt6
    pool:
      vmImage: 'windows-2022'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.10'
        architecture: 'x64'
      displayName: Setup Python
    # aqtinstall version is important to get a working install
    # for the target qt version - also newer qt versions fail to
    # update xml hash from mirrors
    - script: |
        choco install --no-progress -y 7zip neovim
        pip install --upgrade aqtinstall==3.3.0
        cd $(Build.BinariesDirectory)
        python -m aqt install-qt windows desktop 6.10.1 win64_msvc2022_64
      displayName: Install Dependencies
    - powershell: |
        Write-Host "##vso[task.setvariable variable=PATH;]${env:PATH};$(Build.BinariesDirectory)\6.10.1\msvc2022_64\bin;C:\tools\neovim\nvim-win64\bin";
      displayName: Set PATH
    - task: CMake@1
      inputs:
        workingDirectory: $(Build.BinariesDirectory)
        cmakeArgs: -G "Visual Studio 17 2022" -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH=$(Build.BinariesDirectory)\6.10.1\msvc2022_64\lib\cmake;$(Build.BinariesDirectory)\6.10.0\msvc2022_64\bin $(Build.SourcesDirectory)
      displayName: CMake Configure
    - task: CMake@1
      inputs:
        workingDirectory: $(Build.BinariesDirectory)
        cmakeArgs: --build .
      displayName: CMake Build
